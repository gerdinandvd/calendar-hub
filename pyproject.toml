[project]
name = "calendar-hub"
version = "0.0.0"
description = "Personal calendar hub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "tzdata>=2024.1",
    "cryptography>=43,<48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff==0.17.0",
    "pylint==4.1.3",
    "pyright==1.1.414",
    "import-linter==2.15",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not integration and not slow"]
markers = [
    "integration: needs Docker",
    "slow: formal or long-running; skipped by default",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Floor of default-suite baseline (83%) rounded down to nearest 5.
fail_under = 80

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pylint.main]
py-version = "3.12"
jobs = 0
load-plugins = ["pylint.extensions.mccabe"]
ignore-paths = [
    "^tests/",
    "^deploy/",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "duplicate-code",
    "too-complex",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.pylint.format]
# Floor for current app/ (largest module ~999 physical lines); tighten later.
max-module-lines = 800

[tool.pylint.design]
# Calibrated to current app/; tighten only, do not raise without review.
max-args = 12
max-attributes = 15
max-bool-expr = 5
max-branches = 28
max-locals = 38
max-parents = 7
max-public-methods = 20
max-returns = 13
max-statements = 89
max-nested-blocks = 5
max-complexity = 32

[tool.pylint.similarities]
# Floor for current app/; small shared helpers still trip default 4-line matches.
min-similarity-lines = 20
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Sync importers and Radicale client are independent"
type = "independence"
modules = [
    "app.sync.google",
    "app.sync.ics",
    "app.sync.webhook",
    "app.radicale.client",
]
# Shared writer may call Radicale; importers must not import the client themselves.
ignore_imports = [
    "app.sync.apply -> app.radicale.client",
]

[[tool.importlinter.contracts]]
name = "UI and API must not import sync, Radicale, db, secrets, or log"
type = "forbidden"
source_modules = [
    "app.ui",
    "app.api",
]
forbidden_modules = [
    "app.sync",
    "app.radicale",
    "app.db",
    "app.secrets",
    "app.log",
]
# Presentation reaches lower layers only via services/health; direct imports are banned.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.api | app.ui",
    "app.services | app.health | app.i18n",
    "app.sync",
    "app.radicale | app.db",
]
