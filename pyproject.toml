[project]
name = "calendar-hub"
version = "0.0.0"
description = "Personal calendar hub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "tzdata>=2024.1",
    "cryptography>=43,<48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not integration and not slow"]
markers = [
    "integration: needs Docker",
    "slow: formal or long-running; skipped by default",
]

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
