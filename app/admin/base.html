<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx.min.js"></script>
</head>
<body hx-on:htmx:after-settle="var node = document.getElementById('form-error'); if (node) node.focus();">
  <header>
    <p class="brand">{{ t('brand') }}</p>
    <nav>
      <a href="/">{{ t('nav.home') }}</a>
      <a href="/sources">{{ t('nav.sources') }}</a>
      <a href="/calendars">{{ t('nav.calendars') }}</a>
      <a href="/sync">{{ t('nav.sync') }}</a>
      <a href="/health">{{ t('nav.health') }}</a>
    </nav>
    <p class="lang">
      <a href="{{ request.url.include_query_params(lang='en').path }}?{{ request.url.include_query_params(lang='en').query }}">{{ t('lang.en') }}</a>
      <a href="{{ request.url.include_query_params(lang='nl').path }}?{{ request.url.include_query_params(lang='nl').query }}">{{ t('lang.nl') }}</a>
    </p>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
