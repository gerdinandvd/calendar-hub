<div id="webhook-secret">
  {% if error %}
  <div id="form-error" tabindex="-1" role="alert">{{ error }}</div>
  {% endif %}
  <h2>Webhook</h2>
  <p>Endpoint</p>
  <p id="webhook-url">{{ webhook_url }}</p>
  {% if webhook_secret %}
  <p id="webhook-secret-value" class="secret">{{ webhook_secret }}</p>
  <p>This secret is shown once.</p>
  {% else %}
  <p>Secret is set.</p>
  {% endif %}
  <form method="post" action="/sources/{{ source_id }}/rotate-secret" hx-post="/sources/{{ source_id }}/rotate-secret" hx-target="#webhook-secret" hx-swap="outerHTML">
    <button type="submit">Rotate secret</button>
  </form>
</div>
