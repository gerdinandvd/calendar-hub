<div id="source-form">
  {% if errors.top %}
  <div id="form-error" tabindex="-1" role="alert">{{ errors.top }}</div>
  {% endif %}
  <form method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#source-form" hx-swap="outerHTML">
    <h2>{{ t('kind.' ~ kind) }}</h2>
    <label for="name">{{ t('field.name') }}</label>
    <input id="name" name="name" value="{{ draft.name }}" {% if errors.name %}aria-invalid="true" aria-describedby="name-error"{% endif %}>
    {% if errors.name %}
    <p id="name-error">{{ errors.name }}</p>
    {% endif %}
    <button type="submit">{{ submit_label }}</button>
  </form>
</div>
