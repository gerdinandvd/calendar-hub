services:
  hub:
    build: .
    env_file:
      - .env
    environment:
      HUB_RADICALE_URL: http://radicale:5232
    volumes:
      - hub-data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:3.8.1.1
    env_file:
      - .env
    environment:
      TAKE_FILE_OWNERSHIP: "true"
    volumes:
      - radicale-data:/data
      - ./deploy/radicale.config:/config/config:ro
      - ./deploy/radicale-entrypoint.sh:/usr/local/bin/calendar-hub-radicale.sh:ro
      - ./deploy/radicale-users.py:/usr/local/bin/calendar-hub-radicale-users.py:ro
      - ./deploy/radicale-tune.py:/usr/local/bin/calendar-hub-radicale-tune.py:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-radicale.sh"]
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' -X PROPFIND -H 'Depth: 0' http://127.0.0.1:5232/); test \"$$code\" = 401",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7
    env_file:
      - .env
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-entrypoint.sh:/usr/local/bin/calendar-hub-caddy.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-caddy.sh"]
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null --no-check-certificate https://127.0.0.1/ 2>&1 | grep -q 401",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.17
    entrypoint: ["/bin/sh", "-c"]
    command: ["/usr/local/bin/litestream version && exec sleep infinity"]
    volumes:
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/usr/local/bin/litestream", "version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  backup:
    image: kopia/kopia:0.23.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["/bin/kopia --version && exec sleep infinity"]
    volumes:
      - ./deploy/kopia.yml:/etc/kopia.yml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/bin/kopia", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

networks:
  internal:

volumes:
  hub-data:
  radicale-data:
  caddy-data:
  caddy-config:
