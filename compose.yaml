services:
  hub:
    build: .
    env_file:
      - ${HUB_ENV_FILE:-.env}
    environment:
      HUB_RADICALE_URL: http://radicale:5232
      HUB_LITESTREAM_STATUS_PATH: /status/litestream-sync
      HUB_LITESTREAM_HEARTBEAT_PATH: /status/litestream-heartbeat
      HUB_KOPIA_STATUS_PATH: /status/kopia-backup
    volumes:
      - hub-data:/data
      - status:/status
    depends_on:
      radicale:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:3.8.1.1
    env_file:
      - ${HUB_ENV_FILE:-.env}
    environment:
      TAKE_FILE_OWNERSHIP: "true"
    volumes:
      - radicale-data:/data
      - ./deploy/radicale.config:/config/config:ro
      - ./deploy/radicale-entrypoint.sh:/usr/local/bin/calendar-hub-radicale.sh:ro
      - ./deploy/radicale-users.py:/usr/local/bin/calendar-hub-radicale-users.py:ro
      - ./deploy/radicale-tune.py:/usr/local/bin/calendar-hub-radicale-tune.py:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-radicale.sh"]
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' -X PROPFIND -H 'Depth: 0' http://127.0.0.1:5232/); test \"$$code\" = 401",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7
    env_file:
      - ${HUB_ENV_FILE:-.env}
    ports:
      - "${HUB_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-entrypoint.sh:/usr/local/bin/calendar-hub-caddy.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-caddy.sh"]
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null --no-check-certificate https://127.0.0.1/ 2>&1 | grep -q 401",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.17
    env_file:
      - ${HUB_ENV_FILE:-.env}
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-file:///replica/hub}
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-litestream.sh"]
    volumes:
      - hub-data:/data
      - litestream-replica:/replica
      - status:/status
      - ./deploy/litestream-entrypoint.sh:/usr/local/bin/calendar-hub-litestream.sh:ro
    networks:
      - internal
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/litestream", "version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  backup:
    image: kopia/kopia:0.23.1
    hostname: backup
    env_file:
      - ${HUB_ENV_FILE:-.env}
    environment:
      KOPIA_PASSWORD: ${KOPIA_PASSWORD:-local-dev-only}
      KOPIA_REPOSITORY: ${KOPIA_REPOSITORY:-filesystem}
      KOPIA_REPO_PATH: ${KOPIA_REPO_PATH:-/repo}
      KOPIA_CACHE_DIRECTORY: /cache
      KOPIA_CONFIG_PATH: /cache/kopia.config
      KOPIA_LOG_DIR: /cache/log
      KOPIA_CHECK_FOR_UPDATES: "false"
    entrypoint: ["/bin/sh", "/usr/local/bin/calendar-hub-kopia.sh"]
    volumes:
      - radicale-data:/source:ro
      - kopia-repo:/repo
      - kopia-cache:/cache
      - status:/status
      - ./deploy/kopia-entrypoint.sh:/usr/local/bin/calendar-hub-kopia.sh:ro
    networks:
      - internal
    depends_on:
      radicale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/kopia", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

networks:
  internal:

volumes:
  hub-data:
  radicale-data:
  caddy-data:
  caddy-config:
  status:
  litestream-replica:
  kopia-repo:
  kopia-cache:
