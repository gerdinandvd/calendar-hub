name: CI

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check app tests"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check app tests"

  pylint:
    needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Pylint
        run: pylint app

  pyright:
    needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Pyright
        run: pyright

  import-linter:
    needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Lint imports
        run: lint-imports

  pytest:
    needs: [ruff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage
        run: pytest --cov=app --cov-branch --cov-report=term-missing
